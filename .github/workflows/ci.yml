name: CI

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

# A branch only needs its newest commit checked; macOS runners bill at ten
# times the Linux rate, so superseded runs are cancelled rather than queued.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Kept in step with the release job: tests have to run against the same
    # SDK the shipped binary is linked against.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && xcrun --show-sdk-version

      - name: Check formatting
        run: make lint

      - name: Run unit tests
        run: make test

      - name: Build release configuration
        run: make build
