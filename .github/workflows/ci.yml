name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  test:
    # Kept in step with the release job: tests have to run against the same
    # SDK the shipped binary is linked against.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && xcrun --show-sdk-version

      - name: Check formatting
        run: |
          brew install swiftformat
          swiftformat --lint LexiCards

      - name: Build Debug configuration
        run: |
          xcodebuild \
            -project LexiCards.xcodeproj \
            -scheme LexiCards \
            -configuration Debug \
            -sdk macosx \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
