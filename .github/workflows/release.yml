name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # AppKit picks an app's appearance from the SDK it was linked against, not
    # from the macOS running it. Building on an older image shipped a binary
    # that looked like a pre-26 app on every current Mac, while local builds
    # looked native — so the runner image is a user-visible choice, not a
    # detail. The deployment target is set in the project and is
    # unaffected by this.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && xcrun --show-sdk-version

      - name: Run Swift Testing suite
        run: |
          xcodebuild \
            -project LexiCards.xcodeproj \
            -scheme LexiCards \
            -configuration Debug \
            -sdk macosx \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build and package
        run: |
          rm -rf build dist
          mkdir -p dist
          xcodebuild \
            -project LexiCards.xcodeproj \
            -scheme LexiCards \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/LexiCards.app \
            dist/LexiCards.zip

      # The failure this guards against is silent: a runner image whose default
      # Xcode has moved produces a working, correctly versioned app that simply
      # renders as the wrong generation of macOS. Better to fail the release.
      - name: Verify the binary is linked against a current SDK
        run: |
          sdk=$(otool -l build/DerivedData/Build/Products/Release/LexiCards.app/Contents/MacOS/LexiCards \
            | awk '/LC_BUILD_VERSION/ {found=1} found && /sdk /{print $2; exit}')
          sdk=${sdk#macos}
          echo "linked against SDK $sdk"
          case "$sdk" in
            2[6-9].*|[3-9][0-9].*) ;;
            *) echo "::error::expected the macOS 26 SDK or newer, got $sdk"; exit 1 ;;
          esac

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
