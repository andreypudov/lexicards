name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # AppKit picks an app's appearance from the SDK it was linked against, not
    # from the macOS running it. Building on an older image shipped a binary
    # that looked like a pre-26 app on every current Mac, while local builds
    # looked native — so the runner image is a user-visible choice, not a
    # detail. The deployment target (13.5) is set in the project and is
    # unaffected by this.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && xcrun --show-sdk-version

      - name: Run unit tests
        run: make test

      # The zip is named for the version inside the bundle, and the Homebrew
      # cask builds its download URL from the tag. If those disagree the release
      # publishes an asset the cask can never resolve, so they are checked here
      # rather than discovered by whoever runs brew install next.
      - name: Verify the tag matches the project version
        run: |
          version=$(xcodebuild -project LexiCards.xcodeproj -target LexiCards \
            -configuration Release -showBuildSettings \
            | awk -F' = ' '/ MARKETING_VERSION /{print $2; exit}')
          tag=${GITHUB_REF_NAME#v}
          echo "tag $tag, MARKETING_VERSION $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match MARKETING_VERSION $version"
            exit 1
          fi

      - name: Build and package
        run: make release

      # The failure this guards against is silent: a runner image whose default
      # Xcode has moved produces a working, correctly versioned app that simply
      # renders as the wrong generation of macOS. Better to fail the release.
      - name: Verify the binary is linked against a current SDK
        run: |
          sdk=$(otool -l build/Release/LexiCards.app/Contents/MacOS/LexiCards \
                | awk '/LC_BUILD_VERSION/ {found=1} found && /sdk /{print $2; exit}')
          echo "linked against SDK $sdk"
          case "$sdk" in
            2[6-9].*|[3-9][0-9].*) ;;
            *) echo "::error::expected the macOS 26 SDK or newer, got $sdk"; exit 1 ;;
          esac

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
