name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # AppKit picks an app's appearance from the SDK it was linked against, not
    # from the macOS running it. Building on an older image shipped a binary
    # that looked like a pre-26 app on every current Mac, while local builds
    # looked native — so the runner image is a user-visible choice, not a
    # detail. The deployment target (13.5) is set in the project and is
    # unaffected by this.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && xcrun --show-sdk-version

      - name: Run unit tests
        run: make test

      # The zip is named for the version inside the bundle, and the Homebrew
      # cask builds its download URL from the tag. If those disagree the release
      # publishes an asset the cask can never resolve, so they are checked here
      # rather than discovered by whoever runs brew install next.
      - name: Verify the tag matches the project version
        run: |
          version=$(xcodebuild -project LexiCards.xcodeproj -target LexiCards \
            -configuration Release -showBuildSettings \
            | awk -F' = ' '/ MARKETING_VERSION /{print $2; exit}')
          tag=${GITHUB_REF_NAME#v}
          echo "tag $tag, MARKETING_VERSION $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match MARKETING_VERSION $version"
            exit 1
          fi

      # A throwaway keychain, so the certificate never lands in the runner's
      # own. The password only has to live as long as this job.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and package
        run: make release SIGN_IDENTITY="LexiCards Release"

      # These failures would all be silent: an app signed by something else
      # breaks the identity users already have, an app that lost its
      # entitlements runs outside the sandbox, and get-task-allow lets a
      # debugger attach to a released copy.
      - name: Verify the signature
        run: |
          app=build/Release/LexiCards.app
          codesign --verify --strict "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -qx "Authority=LexiCards Release" \
            || { echo "::error::the app is not signed by LexiCards Release"; exit 1; }
          codesign -d --entitlements - "$app" 2>/dev/null | grep -q "com.apple.security.app-sandbox" \
            || { echo "::error::the app lost its sandbox entitlement"; exit 1; }
          if codesign -d --entitlements - "$app" 2>/dev/null | grep -q "com.apple.security.get-task-allow"; then
            echo "::error::the app allows a debugger to attach"
            exit 1
          fi

      # The failure this guards against is silent: a runner image whose default
      # Xcode has moved produces a working, correctly versioned app that simply
      # renders as the wrong generation of macOS. Better to fail the release.
      - name: Verify the binary is linked against a current SDK
        run: |
          sdk=$(otool -l build/Release/LexiCards.app/Contents/MacOS/LexiCards \
                | awk '/LC_BUILD_VERSION/ {found=1} found && /sdk /{print $2; exit}')
          echo "linked against SDK $sdk"
          case "$sdk" in
            2[6-9].*|[3-9][0-9].*) ;;
            *) echo "::error::expected the macOS 26 SDK or newer, got $sdk"; exit 1 ;;
          esac

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
